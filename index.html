<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlugAzit — Global VST Deals & Curation Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0b0f17;
      --header-bg: rgba(11, 15, 23, 0.85);
      --card-bg: #141b2d;
      --card-hover: #1b243b;
      --border-color: #212c42;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --modal-bg: #151c2e;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --header-bg: rgba(248, 250, 252, 0.85);
      --card-bg: #ffffff;
      --card-hover: #f1f5f9;
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --modal-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding-top: 75px;
      transition: background-color 0.25s, color 0.25s;
    }

    /* Fixed Sticky Header */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: 75px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 2rem; z-index: 1000;
      backdrop-filter: blur(12px);
    }

    .logo-container {
      display: flex; align-items: center; gap: 0.6rem; text-decoration: none; cursor: pointer;
    }
    .logo-img { height: 32px; width: auto; display: block; }
    .logo-text { font-size: 1.6rem; font-weight: 900; color: var(--text-primary); letter-spacing: -0.03em; }
    .logo-text span { color: var(--accent-color); }

    nav { display: flex; gap: 1rem; align-items: center; }

    /* Modern Theme Toggle Switch */
    .toggle-switch {
      position: relative; width: 50px; height: 26px;
      background: var(--border-color); border-radius: 20px;
      cursor: pointer; transition: 0.3s; display: flex; align-items: center; padding: 2px;
    }
    .toggle-knob {
      width: 22px; height: 22px; background: #fff; border-radius: 50%;
      transition: 0.3s; transform: translateX(0);
    }
    [data-theme="light"] .toggle-knob { transform: translateX(24px); background: #0f172a; }

    .nav-btn {
      background: transparent; border: 1px solid transparent; color: var(--text-secondary);
      font-size: 0.9rem; font-weight: 600; cursor: pointer; padding: 0.45rem 0.9rem;
      border-radius: 8px; transition: all 0.2s;
    }
    .nav-btn:hover { color: var(--text-primary); background: var(--card-bg); border-color: var(--border-color); }

    .container { max-width: 1140px; margin: 0 auto; padding: 2.5rem 1.5rem; }

    /* Clean Hero Section */
    .hero { text-align: center; padding: 2.5rem 1rem 3rem 1rem; }
    .hero h1 { font-size: 3rem; font-weight: 900; margin-bottom: 0.8rem; letter-spacing: -0.03em; }
    .hero p { color: var(--text-secondary); max-width: 580px; margin: 0 auto 2rem auto; font-size: 1.1rem; }
    
    .social-btns { display: flex; justify-content: center; gap: 0.8rem; }
    .btn-social {
      padding: 0.7rem 1.4rem; border-radius: 8px; font-weight: 700;
      text-decoration: none; color: #fff; font-size: 0.9rem; transition: 0.2s;
    }
    .btn-discord { background-color: #5865F2; }
    .btn-twitter { background-color: #000; border: 1px solid var(--border-color); }
    .btn-social:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Streamlined Category Filters */
    .category-bar {
      display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.8rem; margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
    }
    .cat-chip {
      background: var(--card-bg); border: 1px solid var(--border-color);
      color: var(--text-secondary); padding: 0.5rem 1.1rem; border-radius: 8px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; whitespace: nowrap; transition: 0.2s;
    }
    .cat-chip.active, .cat-chip:hover {
      background: var(--accent-color); color: #fff; border-color: var(--accent-color);
    }
    .cat-chip.affiliate {
      margin-left: auto; border-color: #f59e0b; color: #f59e0b;
    }
    .cat-chip.affiliate:hover { background: #f59e0b; color: #fff; }

    /* Modern Grid Deal Cards UI */
    .deals-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; margin-bottom: 4rem;
    }
    .deal-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px;
      padding: 1.6rem; transition: all 0.25s ease; display: flex; flex-direction: column; justify-content: space-between;
    }
    .deal-card:hover { transform: translateY(-4px); background: var(--card-hover); border-color: var(--accent-color); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
    .brand-name { font-size: 0.8rem; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; tracking: 0.05em; }
    .deal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.8rem; color: var(--text-primary); text-decoration: none; line-height: 1.3; }
    
    .price-box { margin: 1rem 0; padding: 0.8rem; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); }
    .original-price { text-decoration: line-through; color: var(--text-secondary); font-size: 0.85rem; margin-right: 0.4rem; }
    .discount-price { font-size: 1.3rem; font-weight: 900; color: var(--accent-color); }
    .krw-price { font-size: 0.9rem; color: #10b981; font-weight: 700; margin-top: 0.2rem; }

    .tag-badge { padding: 0.25rem 0.55rem; border-radius: 6px; font-size: 0.75rem; font-weight: 800; }
    .tag-discount { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .tag-free { background: rgba(16, 185, 129, 0.15); color: #10b981; }

    .perks-box { font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 1.2rem; line-height: 1.5; }

    .btn-buy {
      width: 100%; padding: 0.8rem; background: var(--accent-color); border: none; border-radius: 8px;
      color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; text-align: center; text-decoration: none; display: block;
      transition: background 0.2s;
    }
    .btn-buy:hover { background: var(--accent-hover); }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 2000;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--modal-bg); border: 1px solid var(--border-color); width: 100%; max-width: 440px;
      border-radius: 16px; padding: 2rem; position: relative; color: var(--text-primary);
    }
    .modal-close { position: absolute; top: 1.2rem; right: 1.2rem; background: none; border: none; color: var(--text-secondary); font-size: 1.4rem; cursor: pointer; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600; }
    .form-group input {
      width: 100%; padding: 0.75rem; background: var(--bg-color); border: 1px solid var(--border-color);
      border-radius: 8px; color: var(--text-primary); font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Fixed Sticky Header -->
  <header>
    <a href="#" class="logo-container" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">
      <!-- 사용자 로고 이미지 반영 영역 (이미지 파일 준비시 아래 src 주석 해제) -->
      <!-- <img src="로고이미지경로.png" alt="PlugAzit Logo" class="logo-img" /> -->
      <div class="logo-text">Plug<span>Azit</span></div>
    </a>
    <nav>
      <!-- Modern Theme Switcher -->
      <div class="toggle-switch" onclick="toggleTheme()" title="테마 변경">
        <div class="toggle-knob"></div>
      </div>
      
      <div id="authNav">
        <button class="nav-btn" onclick="openModal('loginModal')">로그인</button>
        <button class="nav-btn" onclick="openModal('signupModal')">회원가입</button>
      </div>
      <div id="userNav" style="display:none;">
        <button class="nav-btn" onclick="openModal('myPageModal')">👤 마이페이지</button>
        <button class="nav-btn" onclick="handleLogout()">로그아웃</button>
      </div>
    </nav>
  </header>

  <div class="container">
    <!-- Clean Hero Banner -->
    <section class="hero">
      <h1>Sail the Wave of Sound.</h1>
      <p>글로벌 VST 핫딜 큐레이션, 실시간 원화 환산 및 프로듀서 커뮤니티</p>
      <div class="social-btns">
        <a href="https://discord.gg" target="_blank" class="btn-social btn-discord">디스코드 아지트</a>
        <a href="https://x.com" target="_blank" class="btn-social btn-twitter">공식 X (트위터)</a>
      </div>
    </section>

    <!-- Clean Category Filters -->
    <div class="category-bar">
      <button class="cat-chip active" onclick="filterCategory('all', this)">전체보기</button>
      <button class="cat-chip" onclick="filterCategory('synth', this)">신디사이저 / 가상악기</button>
      <button class="cat-chip" onclick="filterCategory('mixing', this)">믹싱 & 마스터링</button>
      <button class="cat-chip" onclick="filterCategory('free', this)">100% FREE</button>
      <button class="cat-chip affiliate" onclick="filterCategory('affiliate', this)">🤝 브랜드 제휴 문의</button>
    </div>

    <!-- Deals Grid UI -->
    <div class="deals-grid" id="dealsContainer"></div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('loginModal')">×</button>
      <h3 style="margin-bottom:1.5rem; font-size:1.3rem;">로그인</h3>
      <form id="loginForm">
        <div class="form-group">
          <label>이메일 계정</label>
          <input type="email" id="loginEmail" placeholder="example@domain.com" required />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-buy" style="margin-top:1rem;">로그인하기</button>
      </form>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal-overlay" id="signupModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('signupModal')">×</button>
      <h3 style="margin-bottom:1.5rem; font-size:1.3rem;">회원가입</h3>
      <form id="signupForm">
        <div class="form-group">
          <label>이메일 계정</label>
          <input type="email" id="signupEmail" placeholder="example@domain.com" required />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="signupPassword" placeholder="8자리 이상 입력" required />
        </div>
        <button type="submit" class="btn-buy" style="margin-top:1rem;">가입 완료하기</button>
      </form>
    </div>
  </div>

  <!-- My Page Modal -->
  <div class="modal-overlay" id="myPageModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('myPageModal')">×</button>
      <h3 style="margin-bottom:1rem; font-size:1.3rem;">👤 마이페이지</h3>
      <div style="margin-bottom:1.5rem; padding:1rem; background:var(--bg-color); border-radius:8px; border:1px solid var(--border-color);">
        <div style="font-size:0.85rem; color:var(--text-secondary);">로그인 계정</div>
        <div id="myPageEmail" style="font-weight:700; margin-top:0.2rem;">-</div>
      </div>
      <h4 style="font-size:1rem; margin-bottom:0.8rem;">📌 나의 관심 딜 (Bookmarks)</h4>
      <div style="font-size:0.9rem; color:var(--text-secondary); text-align:center; padding:1.5rem 0;">
        아직 저장된 관심 딜이 없습니다.
      </div>
    </div>
  </div>

  <script>
    // 1. Supabase Client Setup
    const SUPABASE_URL = "https://pxmkzyhayxsvbbftncwy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_J0LQJ-qjr5ISX1jRKaQ7-A_GwABw8XP";
    let supabaseClient = null;

    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // Theme Toggle Handler
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
    }

    function openModal(id) { document.getElementById(id)?.classList.add('active'); }
    function closeModal(id) { document.getElementById(id)?.classList.remove('active'); }

    // Real Vendor External Direct Links Data & KRW Exchange Rate (1,380 KRW)
    const USD_TO_KRW = 1380;
    const dealsData = [
      {
        brand: "Native Instruments",
        title: "Komplete 14 Standard",
        cat: "synth",
        original: 599,
        discountPrice: 299,
        discountRate: "50% OFF",
        code: "BF-SEASON",
        perk: "개인 라이선스 포함 + 공식 스토어 바우처 제공",
        storeUrl: "https://www.native-instruments.com"
      },
      {
        brand: "Arturia",
        title: "Analog Lab Play",
        cat: "free",
        original: 99,
        discountPrice: 0,
        discountRate: "100% FREE",
        code: "DIRECT-DOWNLOAD",
        perk: "100가지 핵심 빈티지 신스 프리셋 무상 제공",
        storeUrl: "https://www.arturia.com"
      },
      {
        brand: "FabFilter",
        title: "Pro-Q 3 Equalizer",
        cat: "mixing",
        original: 179,
        discountPrice: 134,
        discountRate: "25% OFF",
        code: "FAB-PROMO-2026",
        perk: "업계 표준 EQ 및 계정 크로스그레이드 중복 지원",
        storeUrl: "https://www.fabfilter.com"
      },
      {
        brand: "Waves Audio",
        title: "Horizon Bundle",
        cat: "mixing",
        original: 3999,
        discountPrice: 249,
        discountRate: "93% OFF",
        code: "CREATE80",
        perk: "80개 이상 핵심 믹싱/마스터링 플러그인 동시 포함",
        storeUrl: "https://www.waves.com"
      }
    ];

    function renderDeals(deals) {
      const container = document.getElementById('dealsContainer');
      if (!container) return;

      container.innerHTML = deals.map(d => {
        const krw = d.discountPrice === 0 ? "0원 (무료)" : `약 ${(d.discountPrice * USD_TO_KRW).toLocaleString()}원`;
        const origKrw = d.original ? `$${d.original} (약 ${(d.original * USD_TO_KRW).toLocaleString()}원)` : '';
        const tagClass = d.discountPrice === 0 ? 'tag-free' : 'tag-discount';

        return `
          <div class="deal-card">
            <div>
              <div class="card-header">
                <span class="brand-name">${d.brand}</span>
                <span class="tag-badge ${tagClass}">${d.discountRate}</span>
              </div>
              <a href="${d.storeUrl}" target="_blank" class="deal-title">${d.title}</a>
              <div class="price-box">
                <span class="original-price">${origKrw}</span>
                <span class="discount-price">$${d.discountPrice}</span>
                <div class="krw-price">한화 추산: ${krw}</div>
              </div>
              <div class="perks-box">
                💡 혜택: ${d.perk}<br/>
                🔑 코드: <strong>${d.code}</strong>
              </div>
            </div>
            <a href="${d.storeUrl}" target="_blank" class="btn-buy">공식 스토어 딜 보러가기 ↗</a>
          </div>
        `;
      }).join('');
    }

    function filterCategory(cat, el) {
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');

      if (cat === 'affiliate') {
        alert('🤝 제휴 및 스토어 입점 문의: affiliate@plugazit.com 또는 공식 디스코드 채널로 연락 부탁드립니다.');
        return;
      }
      if (cat === 'all') {
        renderDeals(dealsData);
      } else {
        const filtered = dealsData.filter(d => d.cat === cat || (cat === 'free' && d.discountPrice === 0));
        renderDeals(filtered);
      }
    }

    // Auth & Session Handling
    async function checkUserSession() {
      if (!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      const authNav = document.getElementById('authNav');
      const userNav = document.getElementById('userNav');
      const myPageEmail = document.getElementById('myPageEmail');

      if (session && session.user) {
        if (authNav) authNav.style.display = 'none';
        if (userNav) userNav.style.display = 'flex';
        if (myPageEmail) myPageEmail.textContent = session.user.email;
      } else {
        if (authNav) authNav.style.display = 'flex';
        if (userNav) userNav.style.display = 'none';
      }
    }

    async function handleLogout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
        alert('로그아웃 되었습니다.');
        location.reload();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderDeals(dealsData);
      checkUserSession();

      document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail')?.value;
        const password = document.getElementById('loginPassword')?.value;
        if (!supabaseClient) return alert('Supabase 연동 오류입니다.');

        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert('로그인 실패: ' + error.message);
        else { alert('로그인에 성공했습니다!'); closeModal('loginModal'); checkUserSession(); }
      });

      document.getElementById('signupForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signupEmail')?.value;
        const password = document.getElementById('signupPassword')?.value;
        if (!supabaseClient) return alert('Supabase 연동 오류입니다.');

        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) alert('회원가입 실패: ' + error.message);
        else { alert('가입 요청 성공! 이메일 인증을 확인해 주세요.'); closeModal('signupModal'); }
      });
    });
  </script>
</body>
</html>
