<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlugAzit — Right Near, Your Azit.</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Architectural Dark Wood & Deep Charcoal Tone */
    :root {
      --bg-color: #101211;
      --header-bg: rgba(16, 18, 17, 0.92);
      --card-bg: #171a18;
      --card-hover: #202421;
      --border-color: #272d29;
      --accent-color: #4a5a3a;
      --accent-hover: #5d7049;
      --accent-gold: #c2a878;
      --text-primary: #f2f0eb;
      --text-secondary: #909892;
      --modal-bg: #161917;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    [data-theme="light"] {
      --bg-color: #f5f2eb;
      --header-bg: rgba(245, 242, 235, 0.92);
      --card-bg: #ffffff;
      --card-hover: #ece7de;
      --border-color: #ded8cb;
      --accent-color: #9e8555;
      --accent-hover: #856f43;
      --accent-gold: #222623;
      --text-primary: #1a1d1b;
      --text-secondary: #6e736f;
      --modal-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.65;
      padding-top: 110px;
      letter-spacing: -0.02em;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: fixed; top: 0; left: 0; width: 100%; height: 100px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 3rem; z-index: 1000;
      backdrop-filter: blur(16px);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none; cursor: pointer;
      height: 90px;
    }
    
    .brand-logo-img {
      height: 80px; width: auto; display: block; object-fit: contain;
      transition: filter 0.3s ease;
    }
    [data-theme="dark"] .brand-logo-img { filter: invert(1); }
    [data-theme="light"] .brand-logo-img { filter: none; }

    nav { display: flex; gap: 1rem; align-items: center; }

    .nav-tab-link {
      background: transparent; border: none; color: var(--text-secondary);
      font-size: 0.95rem; font-weight: 600; cursor: pointer; padding: 0.5rem 0.8rem;
      border-radius: 6px; transition: all 0.2s ease; text-decoration: none; display: flex; align-items: center; gap: 0.3rem;
    }
    .nav-tab-link.active, .nav-tab-link:hover {
      color: var(--text-primary); background: var(--card-bg);
    }

    .social-link-btn {
      color: var(--text-secondary); padding: 0.5rem 0.7rem; border-radius: 6px; font-weight: 600; font-size: 0.9rem;
      transition: all 0.2s ease; text-decoration: none; display: flex; align-items: center; gap: 0.4rem;
    }
    .social-link-btn:hover { color: var(--accent-gold); background: var(--card-bg); }

    .toggle-switch {
      position: relative; width: 44px; height: 22px;
      background: var(--border-color); border-radius: 20px;
      cursor: pointer; transition: 0.3s; display: flex; align-items: center; padding: 2px; margin: 0 0.4rem;
    }
    .toggle-knob {
      width: 18px; height: 18px; background: var(--text-primary); border-radius: 50%;
      transition: 0.3s transform ease; transform: translateX(0);
    }
    [data-theme="light"] .toggle-knob { transform: translateX(22px); }

    #authNav, #userNav { display: flex; gap: 0.8rem; align-items: center; }

    .nav-btn {
      background: transparent; border: 1px solid var(--border-color); color: var(--text-primary);
      font-size: 0.88rem; font-weight: 600; cursor: pointer; padding: 0.55rem 1.2rem;
      border-radius: 6px; transition: all 0.2s ease;
    }
    .nav-btn:hover { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }

    .container { max-width: 1280px; margin: 0 auto; padding: 2.5rem 2.5rem; flex: 1; width: 100%; }

    .hero-slogan-section {
      padding: 1.5rem 0 2.2rem 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2.5rem;
    }
    .hero-title {
      font-size: 2.5rem; font-weight: 900; letter-spacing: -0.03em;
      color: var(--text-primary); margin-bottom: 0.6rem;
    }
    .hero-subtitle { font-size: 1.05rem; color: var(--text-primary); font-weight: 600; line-height: 1.6; }

    .category-section { margin-bottom: 2.5rem; }
    .main-cat-bar {
      display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-color); margin-bottom: 1.2rem; align-items: center;
    }
    .cat-chip {
      background: var(--card-bg); border: 1px solid var(--border-color);
      color: var(--text-secondary); padding: 0.6rem 1.4rem; border-radius: 6px;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; whitespace: nowrap; transition: all 0.2s ease;
    }
    .cat-chip.active, .cat-chip:hover { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
    .cat-chip.affiliate { margin-left: auto; border-color: var(--accent-gold); color: var(--accent-gold); }
    .cat-chip.affiliate:hover { background: var(--accent-gold); color: #fff; }

    .sub-cat-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; padding: 0.2rem 0; }
    .sub-chip {
      background: transparent; border: 1px solid var(--border-color);
      color: var(--text-secondary); padding: 0.35rem 0.95rem; border-radius: 20px;
      font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
    }
    .sub-chip.active, .sub-chip:hover { background: var(--card-hover); color: var(--text-primary); border-color: var(--text-primary); }

    /* 정렬 및 셀렉트 박스 화살표 위치 교정 (안쪽 1.2rem에 안정적으로 렌더링) */
    .filter-control-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .search-input-box { position: relative; flex: 1; min-width: 260px; max-width: 420px; }
    .search-input-box input {
      width: 100%; padding: 0.65rem 1rem; background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-primary); font-size: 0.88rem; outline: none; transition: border-color 0.2s;
    }
    .search-input-box input:focus { border-color: var(--accent-gold); }

    .sort-and-view-controls { display: flex; gap: 0.8rem; align-items: center; }

    /* 범용 셀렉트 박스 스타일 */
    select, .sort-select-box select {
      padding: 0.65rem 2.8rem 0.65rem 1.1rem !important;
      background-color: var(--card-bg) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px !important; color: var(--text-primary) !important;
      font-size: 0.88rem !important; outline: none !important; cursor: pointer !important;
      appearance: none !important; -webkit-appearance: none !important; -moz-appearance: none !important;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%20c2a878' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") !important;
      background-repeat: no-repeat !important;
      background-position: right 1.1rem center !important;
    }
    select:focus, .sort-select-box select:focus { border-color: var(--accent-gold) !important; }

    .view-toggle-btns {
      display: flex; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 2px;
    }
    .view-btn {
      background: transparent; border: none; color: var(--text-secondary); padding: 0.45rem 0.8rem; font-size: 0.82rem;
      font-weight: 700; cursor: pointer; border-radius: 4px; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.3rem;
    }
    .view-btn.active { background: var(--accent-color); color: #fff; }

    /* 딜 카드 / 리스트 스타일 (Plugin Boutique 구조 반영) */
    .deals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem; margin-bottom: 4rem; }
    .deals-grid.list-mode { display: flex; flex-direction: column; gap: 1rem; }

    .deal-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px;
      overflow: hidden; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer;
    }
    .deal-card:hover { transform: translateY(-3px); background: var(--card-hover); border-color: var(--accent-gold); }

    .deals-grid.list-mode .deal-card {
      flex-direction: row; align-items: center; padding: 1.2rem 1.6rem; gap: 1.5rem;
    }

    /* Plugin Boutique 스타일 16:9 UI 이미지 박스 */
    .plugin-img-wrapper {
      width: 100%; height: 200px; background: #0c0e0d; display: flex; align-items: center; justify-content: center;
      padding: 1.2rem; border-bottom: 1px solid var(--border-color); position: relative;
    }
    .deals-grid.list-mode .plugin-img-wrapper {
      width: 120px; height: 80px; padding: 0.4rem; border-bottom: none; border-right: 1px solid var(--border-color); flex-shrink: 0;
    }
    .plugin-img-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4)); }

    .deal-card-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .deals-grid.list-mode .deal-card-body { padding: 0; flex-direction: row; align-items: center; gap: 2rem; }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .brand-name { font-size: 0.78rem; color: var(--accent-gold); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .deal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.3rem; color: var(--text-primary); text-decoration: none; line-height: 1.35; }
    .sub-cat-tag { font-size: 0.78rem; color: var(--text-secondary); font-weight: 500; margin-bottom: 0.8rem; }
    .description-text { font-size: 0.88rem; color: var(--text-primary); margin-bottom: 1rem; line-height: 1.5; font-weight: 500; }

    .price-box { margin: 0.8rem 0 1.2rem 0; padding: 0.9rem; background: var(--bg-color); border-radius: 6px; border: 1px solid var(--border-color); }
    .deals-grid.list-mode .price-box { margin: 0; min-width: 160px; text-align: right; }
    .original-price { text-decoration: line-through; color: var(--text-secondary); font-size: 0.85rem; margin-right: 0.5rem; }
    .discount-price { font-size: 1.35rem; font-weight: 900; color: var(--text-primary); }
    .krw-price { font-size: 0.85rem; color: var(--accent-gold); font-weight: 700; margin-top: 0.2rem; }

    .tag-badge { padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.72rem; font-weight: 800; }
    .tag-discount { background: rgba(194, 168, 120, 0.15); color: var(--accent-gold); }
    .tag-free { background: rgba(74, 90, 58, 0.25); color: #8fa874; }

    .btn-buy {
      width: 100%; padding: 0.85rem; background: var(--accent-color); border: none; border-radius: 6px;
      color: #fff; font-weight: 700; font-size: 0.92rem; cursor: pointer; text-align: center; text-decoration: none; display: block;
      transition: background 0.2s ease;
    }
    .btn-buy:hover { background: var(--accent-hover); }

    #communityView, #adminView { display: none; }
    .comm-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 1.6rem; border-radius: 10px; margin-bottom: 1.2rem; }
    .comm-card.notice-card { border-color: var(--accent-gold); background: rgba(194, 168, 120, 0.05); }
    .comm-author { font-weight: 700; color: var(--accent-gold); margin-right: 0.6rem; }
    .comm-category-badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 4px; background: var(--border-color); color: var(--text-primary); margin-right: 0.6rem; font-weight: 700; }

    footer {
      border-top: 1px solid var(--border-color); padding: 2.5rem 2rem; text-align: center;
      color: var(--text-secondary); font-size: 0.82rem; margin-top: auto; background: var(--card-bg); line-height: 1.6;
    }
    footer a { color: var(--text-primary); text-decoration: none; font-weight: 600; }

    /* MODALS & FLEX FIX */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 2000;
      backdrop-filter: blur(6px);
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--modal-bg); border: 1px solid var(--border-color); width: 100%; max-width: 520px;
      border-radius: 12px; padding: 2.2rem; position: relative; color: var(--text-primary);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-box.large-detail-modal { max-width: 820px; }
    .modal-close { position: absolute; top: 1.2rem; right: 1.2rem; background: none; border: none; color: var(--text-secondary); font-size: 1.4rem; cursor: pointer; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.83rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 0.8rem 1rem; background: var(--bg-color); border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-primary); font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }

    /* 닉네임 중복확인 한 줄 수평 강제 정렬 (강박증 정밀 교정) */
    .nickname-input-group {
      display: flex; gap: 0.6rem; align-items: stretch; width: 100%;
    }
    .nickname-input-group input {
      flex: 1; height: 46px; margin: 0;
    }
    .nickname-check-btn {
      height: 46px; min-width: 95px; padding: 0 1.1rem; background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-primary); font-size: 0.85rem; font-weight: 700; cursor: pointer;
      white-space: nowrap !important; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .nickname-check-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

    /* 유튜브 iframe 파이프라인 */
    .youtube-video-container {
      position: relative; width: 100%; padding-bottom: 56.25%; height: 0; margin: 1.5rem 0; border-radius: 8px; overflow: hidden; background: #000;
    }
    .youtube-video-container iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="logo-container" onclick="resetToHome(); return false;">
      <img src="PlugAzit.png" alt="PlugAzit" class="brand-logo-img" />
    </a>

    <nav>
      <button class="nav-tab-link active" id="navDealsBtn" onclick="showPage('deals')">VST Vault</button>
      <button class="nav-tab-link" id="navCommBtn" onclick="showPage('community')">Community</button>
      <button class="nav-tab-link" id="navAdminBtn" style="display:none; color: var(--accent-gold);" onclick="showPage('admin')">Admin Center</button>
      
      <a href="https://discord.gg" target="_blank" class="social-link-btn">Discord</a>
      <a href="https://x.com/plugazit" target="_blank" class="social-link-btn">Twitter</a>

      <div class="toggle-switch" onclick="toggleTheme()" title="다크/라이트 테마">
        <div class="toggle-knob"></div>
      </div>
      
      <div id="authNav">
        <button class="nav-btn" onclick="openModal('loginModal')">로그인</button>
        <button class="nav-btn" onclick="openModal('signupModal')">회원가입</button>
      </div>
      <div id="userNav" style="display:none;">
        <button class="nav-btn" onclick="openMyPageModal()">마이페이지</button>
        <button class="nav-btn" onclick="handleLogout()">로그아웃</button>
      </div>
    </nav>
  </header>

  <div class="container">
    <div class="hero-slogan-section">
      <h1 class="hero-title">Right Near, Your Azit.</h1>
      <p class="hero-subtitle">기다림의 연속, 회상으로 되찾는 나만의 음악</p>
    </div>

    <!-- DEALS VIEW -->
    <div id="dealsView">
      <div class="category-section">
        <div class="main-cat-bar">
          <button class="cat-chip active" id="btnMainCatAll" onclick="setMainCategory('all', this)">전체 딜 보기</button>
          <button class="cat-chip" onclick="setMainCategory('mixing', this)">믹싱 & 마스터링</button>
          <button class="cat-chip" onclick="setMainCategory('synth', this)">신디사이저 / 가상악기</button>
          <button class="cat-chip" onclick="setMainCategory('fx', this)">이펙터 & 유틸리티</button>
          <button class="cat-chip" onclick="setMainCategory('free', this)">100% FREE</button>
          <button class="cat-chip affiliate" onclick="filterCategory('affiliate', this)">브랜드 제휴 문의</button>
        </div>
        <div class="sub-cat-bar" id="subCatBar"></div>
      </div>

      <!-- 정렬 선택 및 카드/리스트 뷰 제어 컨트롤러 -->
      <div class="filter-control-bar">
        <div class="search-input-box">
          <input type="text" id="dealSearchKeyword" placeholder="플러그인명, 브랜드, 키워드 검색..." oninput="onDealFilterChange()">
        </div>
        <div class="sort-and-view-controls">
          <select id="dealSortOption" onchange="onDealFilterChange()">
            <option value="recommended">추천순 (기본)</option>
            <option value="priceLow">가격 낮은순</option>
            <option value="priceHigh">가격 높은순</option>
            <option value="discountHigh">할인율 높은순</option>
            <option value="endingSoon">마감 임박순</option>
          </select>
          <div class="view-toggle-btns">
            <button class="view-btn active" id="btnCardView" onclick="setDealViewMode('card')">⊞ 카드</button>
            <button class="view-btn" id="btnListView" onclick="setDealViewMode('list')">≡ 리스트</button>
          </div>
        </div>
      </div>

      <div class="deals-grid" id="dealsContainer"></div>
    </div>

    <!-- COMMUNITY VIEW -->
    <div id="communityView">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <div>
          <h2 style="font-weight:800; font-size:1.6rem;">Producer Community</h2>
          <p style="color:var(--text-secondary); font-size:0.9rem;">사운드 믹싱 팁과 VST 활용 노하우를 자유롭게 나누세요.</p>
        </div>
        <button class="btn-buy" style="width:auto; padding:0.65rem 1.4rem;" onclick="openModal('postModal')">글 작성하기</button>
      </div>

      <div class="main-cat-bar" style="margin-bottom: 1.2rem;">
        <button class="cat-chip active" onclick="setCommunityCategory('all', this)">전체글</button>
        <button class="cat-chip" onclick="setCommunityCategory('공지사항', this)">공지사항</button>
        <button class="cat-chip" onclick="setCommunityCategory('믹싱/마스터링', this)">믹싱/마스터링</button>
        <button class="cat-chip" onclick="setCommunityCategory('VST/신스', this)">VST/신스</button>
        <button class="cat-chip" onclick="setCommunityCategory('자유수다', this)">자유수다</button>
      </div>

      <div class="filter-control-bar">
        <div class="search-input-box" style="max-width: 100%;">
          <input type="text" id="commSearchKeyword" placeholder="글 제목, 내용, 작성자 닉네임 검색..." oninput="renderCommunityPosts()">
        </div>
      </div>
      
      <div id="communityList"></div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="adminView">
      <div style="background:var(--card-bg); border:1px solid var(--border-color); padding:2rem; border-radius:10px;">
        <h2 style="font-weight:800; font-size:1.4rem; margin-bottom:1rem; color:var(--accent-gold);">VST Deal Management (Admin)</h2>
        <form id="dealForm" onsubmit="handleDealSubmit(event)">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group"><label>브랜드명</label><input type="text" id="dealBrand" required placeholder="FabFilter"></div>
            <div class="form-group"><label>플러그인/딜 타이틀</label><input type="text" id="dealTitle" required placeholder="Pro-Q 3"></div>
          </div>
          <button type="submit" class="btn-buy" style="margin-top:1rem;">새로운 딜 등록</button>
        </form>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 PlugAzit. All rights reserved.  |  Contact: <a href="mailto:aftrdry@outlook.kr">aftrdry@outlook.kr</a></p>
  </footer>

  <!-- MODALS -->

  <!-- VST 상세 정보 모달 (유튜브 플레이어 임베드) -->
  <div class="modal-overlay" id="dealDetailModal">
    <div class="modal-box large-detail-modal">
      <button class="modal-close" onclick="closeModal('dealDetailModal')">×</button>
      <div id="dealDetailContent"></div>
    </div>
  </div>

  <!-- 마이페이지 모달 -->
  <div class="modal-overlay" id="myPageModal">
    <div class="modal-box">

  <script>
    const SUPABASE_URL = "https://pxmkzyhayxsvbbftncwy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_J0LQJ-qjr5ISX1jRKaQ7-A_GwABw8XP";
    let supabaseClient = null;

    const ADMIN_EMAILS = ["aftrdry@outlook.kr", "aftrdry@outlook.com", "sharpmson774@gmail.com"];
    let currentUser = null;
    let rawCommunityPosts = [];
    let dealViewMode = 'card';

    let originalNickname = "";
    let isNicknameVerified = true;

    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    function resetToHome() {
      currentMainCat = 'all';
      currentSubCat = '전체';
      document.getElementById('dealSearchKeyword').value = '';
      document.getElementById('dealSortOption').value = 'recommended';
      renderSubCategories();
      renderDeals();
      showPage('deals');
    }

    function showPage(page) {
      document.getElementById('dealsView').style.display = page === 'deals' ? 'block' : 'none';
      document.getElementById('communityView').style.display = page === 'community' ? 'block' : 'none';
      document.getElementById('adminView').style.display = page === 'admin' ? 'block' : 'none';
      document.getElementById('navDealsBtn').classList.toggle('active', page === 'deals');
      document.getElementById('navCommBtn').classList.toggle('active', page === 'community');
      if (page === 'community') fetchCommunityPosts();
    }

    function openModal(id) { document.getElementById(id)?.classList.add('active'); }
    function closeModal(id) { document.getElementById(id)?.classList.remove('active'); }

    function setDealViewMode(mode) {
      dealViewMode = mode;
      document.getElementById('btnCardView').classList.toggle('active', mode === 'card');
      document.getElementById('btnListView').classList.toggle('active', mode === 'list');
      const container = document.getElementById('dealsContainer');
      if (mode === 'list') {
        container.classList.add('list-mode');
      } else {
        container.classList.remove('list-mode');
      }
      renderDeals();
    }

    const USD_TO_KRW = 1380;
    const subCategories = {
      all: ["전체 보기"],
      mixing: ["전체", "EQ", "Compressor/Limiter", "Reverb/Delay", "De-Esser/Dynamic"],
      synth: ["전체", "Analog/Synth", "Sample Library", "Cinematic/Orchestral"],
      fx: ["전체", "Pitch/Vocal", "Utility/Analyzer"],
      free: ["전체", "Free Synths", "Free FX"]
    };

    /* 이미지 및 유튜브 영상 핫링크 탑재 데이터베이스 */
    const dealsData = [
      { id: 1, brand: "FabFilter", title: "Pro-Q 3 Equalizer", cat: "mixing", sub: "EQ", desc: "트랙 간 믹싱 마스킹 제어 및 위상 왜곡 없는 정밀 이퀄라이징과 Dynamic EQ 작업용 업계 표준 이퀄라이저입니다.", original: 179, discountPrice: 134, discountRateNum: 25, discountRate: "25% OFF", code: "FAB-PROMO-2026", perk: "업계 표준 EQ, Dynamic EQ 모드 지원", storeUrl: "https://www.fabfilter.com", daysLeft: 5, imgUrl: "https://www.fabfilter.com/img/products/pro-q-3-large.png", youtubeId: "3m6_rB69IeA" },
      { id: 2, brand: "oeksound", title: "soothe2 Resonance Suppressor", cat: "mixing", sub: "De-Esser/Dynamic", desc: "보컬이나 악기 트랙에서 발생하는 불쾌한 쏘는 소리와 피크 공명을 실시간으로 감지하여 부드럽게 억제하는 툴입니다.", original: 219, discountPrice: 149, discountRateNum: 32, discountRate: "32% OFF", code: "SOOTHE2026", perk: "불쾌한 공명 사운드 자동 실시간 제어", storeUrl: "https://oeksound.com", daysLeft: 2, imgUrl: "https://oeksound.com/wp-content/uploads/2019/12/soothe2_gui_main.png", youtubeId: "c_QzP8lTz8k" },
      { id: 3, brand: "Celemony", title: "Melodyne 5 assistant", cat: "fx", sub: "Pitch/Vocal", desc: "보컬의 음정과 타이밍을 음질 손상 없이 정밀하게 수정하는 글로벌 표준 보컬 피치 보정 플러그인입니다.", original: 249, discountPrice: 149, discountRateNum: 40, discountRate: "40% OFF", code: "MELODYNE40", perk: "자연스러운 보컬 피치 및 타임 보정 업계 표준", storeUrl: "https://www.celemony.com", daysLeft: 3, imgUrl: "https://www.celemony.com/cgi-bin/WebObjects/License.woa/wa/VTProductDisplay/Melodyne5Assistant_GUI.png", youtubeId: "J2pD1M1T-0A" },
      { id: 4, brand: "Universal Audio", title: "UAD Spark 1 Year Pass", cat: "mixing", sub: "Compressor/Limiter", desc: "DSP 하드웨어 없이 1176, LA-2A, Studer 테이프 머신 등 전설적인 아날로그 하드웨어의 명음기를 구동합니다.", original: 199, discountPrice: 99, discountRateNum: 50, discountRate: "50% OFF", code: "UAD-SPARK-50", perk: "전설적 아날로그 믹싱 기기 네이티브 지원", storeUrl: "https://www.uaudio.com", daysLeft: 1, imgUrl: "https://www.uaudio.com/media/catalog/product/u/a/uad_spark_hero.jpg", youtubeId: "g9Y-4c07FEE" }
    ];

    let currentMainCat = 'all';
    let currentSubCat = '전체';

    function setMainCategory(cat, el) {
      document.querySelectorAll('.main-cat-bar .cat-chip').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');
      currentMainCat = cat;
      currentSubCat = '전체';
      renderSubCategories();
      renderDeals();
    }

    function renderSubCategories() {
      const subBar = document.getElementById('subCatBar');
      const subs = subCategories[currentMainCat] || ["전체"];
      subBar.innerHTML = subs.map(s => `
        <button class="sub-chip ${s === currentSubCat ? 'active' : ''}" onclick="setSubCategory('${s}', this)">${s}</button>
      `).join('');
    }

    function setSubCategory(sub, el) {
      document.querySelectorAll('.sub-chip').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');
      currentSubCat = sub;
      renderDeals();
    }

    function onDealFilterChange() { renderDeals(); }

    function renderDeals() {
      const container = document.getElementById('dealsContainer');
      const searchKeyword = document.getElementById('dealSearchKeyword').value.trim().toLowerCase();
      const sortOption = document.getElementById('dealSortOption').value;

      let filtered = [...dealsData];
      if (currentMainCat !== 'all') {
        filtered = currentMainCat === 'free' ? filtered.filter(d => d.discountPrice === 0) : filtered.filter(d => d.cat === currentMainCat);
      }
      if (currentSubCat !== '전체' && currentSubCat !== '전체 보기') {
        filtered = filtered.filter(d => d.sub === currentSubCat);
      }
      if (searchKeyword !== '') {
        filtered = filtered.filter(d => d.brand.toLowerCase().includes(searchKeyword) || d.title.toLowerCase().includes(searchKeyword));
      }

      if (sortOption === 'priceLow') filtered.sort((a, b) => a.discountPrice - b.discountPrice);
      if (sortOption === 'priceHigh') filtered.sort((a, b) => b.discountPrice - a.discountPrice);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-secondary);">해당되는 VST 딜 정보가 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map(d => {
        const krw = d.discountPrice === 0 ? "0원 (무료)" : `약 ${(d.discountPrice * USD_TO_KRW).toLocaleString()}원`;
        const origKrw = d.original ? `$${d.original}` : '';
        const tagClass = d.discountPrice === 0 ? 'tag-free' : 'tag-discount';

        return `
          <div class="deal-card" onclick="openDealDetailModal(${d.id})">
            <div class="plugin-img-wrapper">
              <img src="${d.imgUrl}" alt="${d.title}" onerror="this.src='PlugAzit.png'">
            </div>
            <div class="deal-card-body">
              <div>
                <div class="card-header">
                  <span class="brand-name">${d.brand}</span>
                  <span class="tag-badge ${tagClass}">${d.discountRate}</span>
                </div>
                <div class="deal-title">${d.title}</div>
                <div class="sub-cat-tag"># ${d.sub}</div>
                <div class="description-text">${d.desc}</div>
              </div>
              <div>
                <div class="price-box">
                  <span class="original-price">${origKrw}</span>
                  <span class="discount-price">$${d.discountPrice}</span>
                  <div class="krw-price">${krw}</div>
                </div>
                <button class="btn-buy" onclick="event.stopPropagation(); window.open('${d.storeUrl}', '_blank')">공식 스토어 딜 바로가기 ↗</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* VST 클릭 시 전체 페이지 형태 모달 레이어 렌더링 */
    function openDealDetailModal(id) {
      const deal = dealsData.find(d => d.id === id);
      if (!deal) return;

      const detailContent = document.getElementById('dealDetailContent');
      const krw = deal.discountPrice === 0 ? "0원 (무료)" : `약 ${(deal.discountPrice * USD_TO_KRW).toLocaleString()}원`;

      detailContent.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;">
          <div>
            <span style="color:var(--accent-gold); font-weight:800; text-transform:uppercase; font-size:0.85rem;">${deal.brand}</span>
            <h2 style="font-size:2rem; font-weight:900; margin-top:0.2rem;">${deal.title}</h2>
          </div>
          <span class="tag-badge tag-discount" style="font-size:1rem; padding:0.4rem 0.8rem;">${deal.discountRate}</span>
        </div>

        <div class="plugin-img-wrapper" style="height:260px; border-radius:8px; border:1px solid var(--border-color); margin-bottom:1.5rem;">
          <img src="${deal.imgUrl}" alt="${deal.title}">
        </div>

        <p style="font-size:1rem; color:var(--text-primary); line-height:1.7; margin-bottom:1.5rem;">${deal.desc}</p>

        <!-- 유튜브 연동 플레이어 -->
        <h4 style="font-weight:800; font-size:1.1rem; color:var(--accent-gold);">공식 데모 / 사운드 리뷰 영상</h4>
        <div class="youtube-video-container">
          <iframe src="https://www.youtube.com/embed/${deal.youtubeId}" allowfullscreen></iframe>
        </div>

        <div class="price-box" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <span class="original-price" style="font-size:1rem;">정가 $${deal.original}</span>
            <span class="discount-price" style="font-size:1.8rem; margin-left:0.5rem;">$${deal.discountPrice}</span>
          </div>
          <div class="krw-price" style="font-size:1.1rem;">한화: ${krw}</div>
        </div>

        <a href="${deal.storeUrl}" target="_blank" class="btn-buy" style="font-size:1.05rem; padding:1rem; text-align:center; margin-top:1.2rem;">공식 스토어 구매 페이지로 이동 ↗</a>
      `;

      openModal('dealDetailModal');
    }

    // --- 닉네임 중복확인 고속 검증 로직 ---
    function onNicknameInputChanged() {
      const inputVal = document.getElementById('myPageNickname').value.trim();
      const msgEl = document.getElementById('nicknameCheckMsg');
      const saveBtn = document.getElementById('btnSaveProfile');

      if (inputVal === originalNickname) {
        isNicknameVerified = true;
        msgEl.style.color = 'var(--text-secondary)';
        msgEl.innerText = '현재 본인의 닉네임입니다.';
        saveBtn.disabled = false; saveBtn.style.opacity = '1'; saveBtn.style.cursor = 'pointer';
      } else {
        isNicknameVerified = false;
        msgEl.style.color = '#e74c3c';
        msgEl.innerText = '닉네임 변경 시 [중복 확인] 버튼을 눌러주세요.';
        saveBtn.disabled = true; saveBtn.style.opacity = '0.5'; saveBtn.style.cursor = 'not-allowed';
      }
    }

    async function checkNicknameDuplicate() {
      const nickname = document.getElementById('myPageNickname').value.trim();
      const msgEl = document.getElementById('nicknameCheckMsg');
      const saveBtn = document.getElementById('btnSaveProfile');

      if (!nickname) { alert('닉네임을 입력해 주세요.'); return; }
      if (nickname === originalNickname) {
        isNicknameVerified = true;
        msgEl.style.color = 'var(--text-secondary)';
        msgEl.innerText = '현재 본인의 닉네임입니다.';
        saveBtn.disabled = false; saveBtn.style.opacity = '1'; saveBtn.style.cursor = 'pointer';
        return;
      }

      if (!supabaseClient) {
        isNicknameVerified = true;
        msgEl.style.color = '#8fa874';
        msgEl.innerText = '사용 가능한 닉네임입니다.';
        saveBtn.disabled = false; saveBtn.style.opacity = '1'; saveBtn.style.cursor = 'pointer';
        return;
      }

      const { data } = await supabaseClient.from('profiles').select('id').eq('nickname', nickname).maybeSingle();

      if (data) {
        isNicknameVerified = false;
        msgEl.style.color = '#e74c3c';
        msgEl.innerText = '이미 사용 중인 닉네임입니다.';
        saveBtn.disabled = true; saveBtn.style.opacity = '0.5'; saveBtn.style.cursor = 'not-allowed';
      } else {
        isNicknameVerified = true;
        msgEl.style.color = '#8fa874';
        msgEl.innerText = '사용 가능한 닉네임입니다.';
        saveBtn.disabled = false; saveBtn.style.opacity = '1'; saveBtn.style.cursor = 'pointer';
      }
    }

    async function openMyPageModal() {
      openModal('myPageModal');
      if (!supabaseClient) {
        originalNickname = '@aftrdry';
        document.getElementById('myPageEmail').value = 'aftrdry@outlook.kr';
        document.getElementById('myPageNickname').value = originalNickname;
        document.getElementById('myPageDaw').value = 'Logic Pro';
        onNicknameInputChanged();
        return;
      }
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;
      document.getElementById('myPageEmail').value = session.user.email || '';
      const { data } = await supabaseClient.from('profiles').select('nickname, main_daw').eq('id', session.user.id).maybeSingle();
      if (data && data.nickname) {
        originalNickname = data.nickname;
        document.getElementById('myPageNickname').value = originalNickname;
        if (data.main_daw) document.getElementById('myPageDaw').value = data.main_daw;
      }
      onNicknameInputChanged();
    }

    async function handleProfileUpdateSubmit(e) {
      e.preventDefault();
      const nickname = document.getElementById('myPageNickname').value.trim();
      const main_daw = document.getElementById('myPageDaw').value;
      if (!isNicknameVerified) { alert('닉네임 중복 확인을 진행해 주세요.'); return; }
      if (!supabaseClient) { alert('프로필 저장이 완료되었습니다.'); closeModal('myPageModal'); return; }
      const { data: { session } } = await supabaseClient.auth.getSession();
      const { error } = await supabaseClient.from('profiles').upsert({ id: session.user.id, email: session.user.email, nickname, main_daw, updated_at: new Date() });
      if (error) { alert('저장 실패: ' + error.message); } else { alert('저장 완료.'); originalNickname = nickname; closeModal('myPageModal'); }
    }

    async function fetchCommunityPosts() {
      const listEl = document.getElementById('communityList');
      if (!supabaseClient) {
        rawCommunityPosts = [{ id: 1, category: "공지사항", author_nickname: "@aftrdry", title: "PlugAzit 서비스 개설 안내", content: "프로듀서 전문 아지트 오픈", created_at: new Date().toISOString() }];
        renderCommunityPosts(); return;
      }
      const { data } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
      rawCommunityPosts = data || [];
      renderCommunityPosts();
    }

    function renderCommunityPosts() {
      const listEl = document.getElementById('communityList');
      listEl.innerHTML = rawCommunityPosts.map(p => `
        <div class="comm-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem;">
            <div><span class="comm-category-badge">${p.category}</span><span class="comm-author">${p.author_nickname}</span></div>
          </div>
          <h4 style="font-size:1.1rem; font-weight:700;">${p.title}</h4>
          <p style="font-size:0.92rem; color:var(--text-secondary); margin-top:0.4rem;">${p.content}</p>
        </div>
      `).join('');
    }

    async function handlePostSubmit(e) {
      e.preventDefault();
      const category = document.getElementById('postCategorySelect').value;
      const title = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postContent').value.trim();
      if (!supabaseClient) { closeModal('postModal'); return; }
      const { data: { session } } = await supabaseClient.auth.getSession();
      await supabaseClient.from('posts').insert([{ user_id: session.user.id, author_nickname: originalNickname || '@aftrdry', category, title, content }]);
      closeModal('postModal'); fetchCommunityPosts();
    }

    async function checkUserSession() {
      if (!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUser = session?.user || null;
      document.getElementById('authNav').style.display = currentUser ? 'none' : 'flex';
      document.getElementById('userNav').style.display = currentUser ? 'flex' : 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSubCategories();
      renderDeals();
      checkUserSession();
    });
  </script>
