<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlugAzit — 믹싱, VST 딜 큐레이션 &amp; 노하우 허브</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131927;
      --border-color: #1f293d;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --modal-bg: #161e2e;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding: 0 1.5rem 3rem 1.5rem;
      max-width: 1080px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }
    .logo { font-size: 1.5rem; font-weight: 800; color: #fff; cursor: pointer; text-decoration: none; }
    .logo span { color: var(--accent-color); }
    nav { display: flex; gap: 1rem; align-items: center; }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .nav-btn:hover { color: #fff; background-color: var(--card-bg); }

    /* Main Banner */
    .hero { text-align: center; padding: 3rem 1rem; }
    .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; }
    .hero p { color: var(--text-secondary); max-width: 600px; margin: 0 auto 2rem auto; font-size: 1.05rem; }
    .social-btns { display: flex; justify-content: center; gap: 1rem; }
    .btn-social {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      font-size: 0.95rem;
    }
    .btn-discord { background-color: #5865F2; }
    .btn-twitter { background-color: #1DA1F2; }

    /* Deals Table */
    .section-title { font-size: 1.3rem; font-weight: 700; margin: 2rem 0 1rem 0; display: flex; justify-content: space-between; align-items: center; }
    .table-container { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-secondary); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    .tag { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
    .tag-free { background-color: rgba(16, 185, 129, 0.2); color: #10B981; }
    .tag-discount { background-color: rgba(245, 158, 11, 0.2); color: #F59E0B; }
    .deal-link { color: var(--text-primary); text-decoration: none; font-weight: 600; }
    .deal-link:hover { color: var(--accent-color); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--modal-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 2rem;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 1.25rem; right: 1.25rem;
      background: none; border: none;
      color: var(--text-secondary);
      font-size: 1.5rem; cursor: pointer;
    }
    .modal-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .form-group input {
      width: 100%; padding: 0.75rem;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px; color: #fff;
      font-size: 0.95rem;
    }
    .btn-submit {
      width: 100%; padding: 0.8rem;
      background: var(--accent-color);
      border: none; border-radius: 6px;
      color: #fff; font-weight: 700;
      font-size: 1rem; cursor: pointer;
    }
    .btn-submit:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="logo">Plug<span>Azit</span></a>
    <nav>
      <div id="authNav">
        <button class="nav-btn" onclick="openModal('loginModal')">로그인</button>
        <button class="nav-btn" onclick="openModal('signupModal')">회원가입</button>
      </div>
      <div id="userNav" style="display:none;">
        <span id="userEmailSpan" style="font-size:0.9rem; color:var(--text-secondary); margin-right:0.5rem;"></span>
        <button class="nav-btn" onclick="handleLogout()">로그아웃</button>
      </div>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Sail the Wave of Sound.</h1>
    <p>PlugAzit은 급변하는 AI와 시류 속에서도 자신만의 예술적 지향점을 향해 항해하는 프로듀서들을 위한 글로벌 VST 딜 큐레이션 허브입니다.</p>
    <div class="social-btns">
      <a href="https://discord.gg" target="_blank" class="btn-social btn-discord">디스코드 아지트 입장</a>
      <a href="https://x.com" target="_blank" class="btn-social btn-twitter">공식 X (트위터) 팔로우</a>
    </div>
  </section>

  <!-- Hot Deals Section -->
  <section>
    <div class="section-title">
      <span>GLOBAL VST CURATION &amp; HOT DEALS</span>
      <span style="font-size:0.8rem; color:var(--text-secondary);">Supabase 실시간 수집</span>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>구분</th>
            <th>제품명 / 브랜드</th>
            <th>할인가</th>
            <th>혜택 / 코드</th>
          </tr>
        </thead>
        <tbody id="dealsTableBody">
          <tr><td colspan="4" style="text-align:center; color:var(--text-secondary);">핫딜 목록을 불러오는 중입니다...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('loginModal')">&times;</button>
      <div class="modal-title">로그인</div>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">이메일</label>
          <input type="email" id="loginEmail" placeholder="example@domain.com" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-submit">로그인</button>
      </form>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal-overlay" id="signupModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('signupModal')">&times;</button>
      <div class="modal-title">회원가입</div>
      <form id="signupForm">
        <div class="form-group">
          <label for="signupEmail">이메일</label>
          <input type="email" id="signupEmail" placeholder="example@domain.com" required />
        </div>
        <div class="form-group">
          <label for="signupPassword">비밀번호</label>
          <input type="password" id="signupPassword" placeholder="8자리 이상 입력" required />
        </div>
        <button type="submit" class="btn-submit">가입하기</button>
      </form>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    // 1. Supabase 클라이언트 초기화
    const SUPABASE_URL = "https://pxmkzyhayxsvbbftncwy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_J0LQJ-qjr5ISX1jRKaQ7-A_GwABw8XP";

    let supabaseClient = null;

    function initSupabase() {
      if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        console.error("Supabase SDK가 아직 로드되지 않았습니다.");
      }
    }

    // Modal Control Functions
    function openModal(id) {
      document.getElementById(id)?.classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id)?.classList.remove('active');
    }

    // 2. 핫딜 목록 불러오기
    async function fetchAndRenderDeals() {
      const tbody = document.getElementById('dealsTableBody');
      if (!tbody) return;

      if (!supabaseClient) {
        initSupabase();
      }

      if (!supabaseClient) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Supabase 연결 대기 중...</td></tr>';
        return;
      }

      try {
        const { data: deals, error } = await supabaseClient.from('deals').select('*').order('created_at', { ascending: false });

        if (error || !deals || deals.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td><span class="tag tag-discount">50% OFF</span></td>
              <td><a href="#" class="deal-link">Native Instruments Komplete 14</a></td>
              <td>~$175</td>
              <td>BF-SEASON</td>
            </tr>
            <tr>
              <td><span class="tag tag-free">100% FREE</span></td>
              <td><a href="#" class="deal-link">Arturia Analog Lab Play</a></td>
              <td>$0 (무료)</td>
              <td>DIRECT-DOWNLOAD</td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = deals.map(deal => `
          <tr>
            <td><span class="tag ${deal.discount?.includes('100%') ? 'tag-free' : 'tag-discount'}">${deal.discount || 'HOT'}</span></td>
            <td><a href="${deal.link || '#'}" target="_blank" class="deal-link">${deal.title}</a></td>
            <td>${deal.price || 'Free'}</td>
            <td>${deal.promo_code || 'DIRECT-LINK'}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    // 3. 사용자 세션 상태 확인
    async function checkUserSession() {
      if (!supabaseClient) initSupabase();
      if (!supabaseClient) return;

      const { data: { session } } = await supabaseClient.auth.getSession();
      
      const authNav = document.getElementById('authNav');
      const userNav = document.getElementById('userNav');
      const userEmailSpan = document.getElementById('userEmailSpan');

      if (session && session.user) {
        if (authNav) authNav.style.display = 'none';
        if (userNav) userNav.style.display = 'flex';
        if (userEmailSpan) userEmailSpan.textContent = session.user.email;
      } else {
        if (authNav) authNav.style.display = 'flex';
        if (userNav) userNav.style.display = 'none';
      }
    }

    // 4. 로그아웃 처리
    async function handleLogout() {
      if (!supabaseClient) initSupabase();
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
        alert('로그아웃 되었습니다.');
        location.reload();
      }
    }

    // 5. DOM 로드 완료 후 이벤트 바인딩
    document.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      fetchAndRenderDeals();
      checkUserSession();

      // 로그인 폼 제출 이벤트
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const email = document.getElementById('loginEmail')?.value;
          const password = document.getElementById('loginPassword')?.value;

          if (!supabaseClient) initSupabase();

          if (!supabaseClient) {
            alert('Supabase 연동이 준비되지 않았습니다. 페이지를 다시고쳐주세요.');
            return;
          }

          try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
              alert('로그인 실패: ' + error.message);
            } else {
              alert('로그인 성공!');
              closeModal('loginModal');
              checkUserSession();
            }
          } catch (err) {
            alert('로그인 처리 중 오류가 발생했습니다: ' + err.message);
          }
        });
      }

      // 회원가입 폼 제출 이벤트
      const signupForm = document.getElementById('signupForm');
      if (signupForm) {
        signupForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const email = document.getElementById('signupEmail')?.value;
          const password = document.getElementById('signupPassword')?.value;

          if (!supabaseClient) initSupabase();

          if (!supabaseClient) {
            alert('Supabase 연동이 준비되지 않았습니다.');
            return;
          }

          try {
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
              alert('회원가입 실패: ' + error.message);
            } else {
              alert('회원가입 요청 성공! 이메일을 확인해 주세요.');
              closeModal('signupModal');
            }
          } catch (err) {
            alert('회원가입 처리 중 오류: ' + err.message);
          }
        });
      }
    });
  </script>
</body>
</html>
